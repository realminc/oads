[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "oadspython"
version = "0.4.0"
description = "oads — Realm dataset packs and loaders for OA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Realm" }]
dependencies = ["oapython>=0.16"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Programming Language :: Rust",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/realminc/oads"
Source = "https://github.com/realminc/oads"
Documentation = "https://dev.realm.software/"
Issues = "https://github.com/realminc/oads/issues"

[tool.maturin]
manifest-path = "src/py/Cargo.toml"
module-name = "oads._native"
python-source = "src/py"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]
strip = true

[tool.pytest.ini_options]
testpaths = ["test/py"]
pythonpath = ["src/py"]
